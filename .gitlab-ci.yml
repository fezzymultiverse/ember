# Ember: GitLab CI build. Same steps as .github/workflows/build.yml (signed release APK).
# Needs CI/CD variables: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (same values as the GitHub secrets).
build-apk:
  image: mingc/android-build-box:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - java -version
    - node -v
    - for f in www/*.js; do node --check "$f"; done
    - node tests/safety-test.js
    - npm install --no-audit --no-fund
    - npx cap add android || true
    - python3 scripts/apply_android_patch.py android android_patch
    - npx cap sync android
    - test -n "$KEYSTORE_BASE64"
    - echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
    - cd android && chmod +x gradlew
    - KEYSTORE_PASS="$KEYSTORE_PASSWORD" KEY_ALIAS="$KEY_ALIAS" KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" ./gradlew assembleRelease --no-daemon --stacktrace
  artifacts:
    name: ember-apk
    paths:
      - android/app/build/outputs/apk/release/app-release.apk
    expire_in: never
