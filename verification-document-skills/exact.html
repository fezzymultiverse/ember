<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline fixture dashboard</title><style>:root{--accent:#1f5f99}*{box-sizing:border-box}body{margin:0;font:16px/1.6 system-ui;background:#edf3f8;color:#172331}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:clamp(24px,4vw,40px)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{padding:20px;border-radius:12px;background:white}button,input{font:inherit;min-height:44px}button{background:var(--accent);color:white;border:0;padding:10px 18px;cursor:pointer}input{max-width:100%;width:100%;margin:8px 0}svg{display:block;width:100%;height:auto}button:focus-visible,input:focus-visible{outline:3px solid #e09b26;outline-offset:3px}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:16px}}@page{size:A4;margin:18mm}@media print{body{background:white}.controls{display:none}.card{break-inside:avoid}h1,h2{break-after:avoid}body{margin:0}}</style></head><body><main><h1>Working HTML fixture</h1><div class="grid"><section class="card"><h2>Real local interaction</h2><label for="name">Display name</label><input id="name" value="Ember"><button type="button" id="apply">Apply name</button><p id="result" role="status">Ready</p></section><section class="card"><h2>Supplied fixture data</h2><svg viewBox="0 0 300 160" role="img" aria-label="Category A: 50 units, category B: 30 units"><line x1="30" y1="125" x2="280" y2="125" stroke="#555"/><rect x="60" y="25" width="50" height="100" fill="#1f5f99"/><rect x="180" y="65" width="50" height="60" fill="#13786f"/><text x="60" y="148">A: 50 u</text><text x="180" y="148">B: 30 u</text></svg><p>Values: A 50 units; B 30 units. Source: supplied fixture data.</p></section></div></main><script>document.getElementById("apply").addEventListener("click",()=>{const value=document.getElementById("name").value.trim();document.getElementById("result").textContent=value?"Hello, "+value:"Please enter a name";});</script></body></html>
