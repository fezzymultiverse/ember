name: NewPipe Extractor weekly update

# YouTube changes break NewPipe. Every Monday this builds with the newest NewPipe
# Extractor release and commits scripts/newpipe.version ONLY if the build passes.
# Manual run: Actions > NewPipe Extractor weekly update > Run workflow.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Find newest NewPipe Extractor release
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api repos/TeamNewPipe/NewPipeExtractor/releases/latest --jq .tag_name)"
          current="$(tr -d '[:space:]' < scripts/newpipe.version 2>/dev/null || true)"
          echo "latest=$latest current=$current"
          if ! echo "$latest" | grep -Eq '^v?[0-9][0-9A-Za-z.-]*$'; then
            echo "::error::Unexpected release tag: $latest"
            exit 1
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already on $latest, nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.ver.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        if: steps.ver.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build with the new version (compile check, debug APK)
        if: steps.ver.outputs.changed == 'true'
        env:
          NEWPIPE_VERSION: ${{ steps.ver.outputs.latest }}
        run: |
          npm install
          [ -d android ] || npx cap add android
          python3 scripts/apply_android_patch.py android android_patch
          npx cap sync android
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || true)"
          [ -n "$SDKM" ] || SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Commit new version (only reached if the build passed)
        if: steps.ver.outputs.changed == 'true'
        run: |
          echo "${{ steps.ver.outputs.latest }}" > scripts/newpipe.version
          git config user.name "ember-ci"
          git config user.email "ember-ci@users.noreply.github.com"
          git add scripts/newpipe.version
          git commit -m "Bump NewPipe Extractor to ${{ steps.ver.outputs.latest }}"
          git push
