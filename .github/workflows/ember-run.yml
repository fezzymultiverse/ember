# ember-runner v1
name: Ember Run
on:
  workflow_dispatch:
    inputs:
      command:
        description: Shell command Ember wants to run
        required: true
        type: string
      workdir:
        description: Folder to run it in
        required: false
        default: '.'
        type: string
permissions:
  contents: write
concurrency:
  group: ember-run
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run command
        id: run
        shell: bash
        env:
          EMBER_CMD: ${{ inputs.command }}
          EMBER_DIR: ${{ inputs.workdir }}
        run: |
          mkdir -p "$RUNNER_TEMP/ember-out/files"
          export EMBER_OUT="$RUNNER_TEMP/ember-out/files"
          set +e
          (cd "${EMBER_DIR:-.}" && bash -c "$EMBER_CMD") 2>&1 | tee "$RUNNER_TEMP/ember-out/log.txt"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.run.outputs.rc }}
        run: |
          OUT="$RUNNER_TEMP/ember-out"; ID="$GITHUB_RUN_ID"; TAG=""
          if [ -n "$(ls -A "$OUT/files" 2>/dev/null)" ]; then
            TAG="ember-run-$ID"
            gh release create "$TAG" "$OUT"/files/* --title "Ember run $ID" --notes "Made by Ember run $ID" || TAG=""
          fi
          FILES=$(ls "$OUT/files" 2>/dev/null | paste -sd, -)
          mkdir -p "$RUNNER_TEMP/res" && cd "$RUNNER_TEMP/res"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin ember-results 2>/dev/null; then git checkout -q -b ember-results FETCH_HEAD; else git checkout -q --orphan ember-results; fi
          mkdir -p "runs/$ID"
          tail -c 200000 "$OUT/log.txt" > "runs/$ID/log.txt" 2>/dev/null || echo "(no output)" > "runs/$ID/log.txt"
          printf '{"run":%s,"exit":%s,"tag":"%s","files":"%s"}\n' "$ID" "${RC:-1}" "$TAG" "$FILES" > "runs/$ID/status.json"
          git add -A
          git -c user.name=ember -c user.email=ember@users.noreply.github.com commit -q -m "Ember run $ID"
          git push -q origin HEAD:ember-results
      - name: Report exit code
        if: always()
        run: exit ${{ steps.run.outputs.rc || 1 }}
