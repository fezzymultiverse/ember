name: Android APK Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Add Android platform
        run: |
          npx cap add android || true
          test -d android

      - name: Apply native Android patch
        run: python3 scripts/apply_android_patch.py android android_patch

      - run: npx cap sync android
      - uses: android-actions/setup-android@v4
      - name: Install SDK packages manually
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > android/app/release.keystore
      - name: Bump versionCode
        run: |
          sed -i "/defaultConfig {/,/}/s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "/defaultConfig {/,/}/s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Configure Signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          if 'signingConfigs' not in text:
              text = text.replace(
                  "    buildTypes {\n",
                  """    signingConfigs {
              release {
                  storeFile file("release.keystore")
                  storePassword System.getenv("KEYSTORE_PASS")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEYSTORE_PASS")
              }
          }
          buildTypes {
          """,
                  1,
              )
          if 'signingConfig signingConfigs.release' not in text:
              text = text.replace(
                  "        release {\n",
                  "        release {\n            signingConfig signingConfigs.release\n",
                  1,
              )
          p.write_text(text)
          PY
      - name: Build APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        working-directory: android
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: signed-app
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "${{ github.event.repository.name }}.apk"
          gh release create "V${{ github.run_number }}" "${{ github.event.repository.name }}.apk" --title "V${{ github.run_number }}" --notes "Signed build" --clobber
